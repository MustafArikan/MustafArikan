<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Mustafa Arıkan – Computer Engineer focused on AI / ML" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#1b1033"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#a371f7"/>
      <stop offset="100%" stop-color="#3fb950"/>
      <animate attributeName="x1" values="0;0.4;0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <style>
      .name { font: 700 54px 'Segoe UI', Helvetica, Arial, sans-serif; fill: url(#title); }
      .role { font: 500 20px 'Courier New', Consolas, monospace; fill: #c9d1d9; }
      .tag  { font: 400 14px 'Courier New', Consolas, monospace; fill: #8b949e; }
      .link { stroke: #30363d; stroke-width: 1; }
      .pulse { stroke: #58a6ff; stroke-width: 1.6; stroke-dasharray: 6 60; fill: none; }
      .n { fill: #58a6ff; }
      .n2 { fill: #a371f7; }
      .n3 { fill: #3fb950; }
    </style>
  </defs>

  <rect width="1000" height="280" fill="url(#bg)"/>
  <circle cx="820" cy="140" r="170" fill="url(#glow)">
    <animate attributeName="r" values="150;190;150" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- neural network (right side) -->
  <g>
    <!-- layer 1 -> 2 links -->
    <g class="link">
      <line x1="680" y1="60"  x2="780" y2="40"/><line x1="680" y1="60"  x2="780" y2="105"/><line x1="680" y1="60"  x2="780" y2="170"/>
      <line x1="680" y1="120" x2="780" y2="40"/><line x1="680" y1="120" x2="780" y2="105"/><line x1="680" y1="120" x2="780" y2="170"/><line x1="680" y1="120" x2="780" y2="235"/>
      <line x1="680" y1="180" x2="780" y2="105"/><line x1="680" y1="180" x2="780" y2="170"/><line x1="680" y1="180" x2="780" y2="235"/>
      <line x1="680" y1="240" x2="780" y2="170"/><line x1="680" y1="240" x2="780" y2="235"/>
      <!-- layer 2 -> 3 -->
      <line x1="780" y1="40"  x2="880" y2="75"/><line x1="780" y1="40"  x2="880" y2="150"/>
      <line x1="780" y1="105" x2="880" y2="75"/><line x1="780" y1="105" x2="880" y2="150"/><line x1="780" y1="105" x2="880" y2="215"/>
      <line x1="780" y1="170" x2="880" y2="75"/><line x1="780" y1="170" x2="880" y2="150"/><line x1="780" y1="170" x2="880" y2="215"/>
      <line x1="780" y1="235" x2="880" y2="150"/><line x1="780" y1="235" x2="880" y2="215"/>
      <!-- layer 3 -> 4 -->
      <line x1="880" y1="75"  x2="950" y2="110"/><line x1="880" y1="150" x2="950" y2="110"/><line x1="880" y1="215" x2="950" y2="110"/>
      <line x1="880" y1="75"  x2="950" y2="180"/><line x1="880" y1="150" x2="950" y2="180"/><line x1="880" y1="215" x2="950" y2="180"/>
    </g>

    <!-- travelling signals -->
    <line class="pulse" x1="680" y1="120" x2="780" y2="105"><animate attributeName="stroke-dashoffset" from="66" to="0" dur="2.2s" repeatCount="indefinite"/></line>
    <line class="pulse" x1="780" y1="105" x2="880" y2="150"><animate attributeName="stroke-dashoffset" from="66" to="0" dur="2.2s" begin="0.5s" repeatCount="indefinite"/></line>
    <line class="pulse" x1="880" y1="150" x2="950" y2="110"><animate attributeName="stroke-dashoffset" from="66" to="0" dur="2.2s" begin="1s" repeatCount="indefinite"/></line>
    <line class="pulse" x1="680" y1="240" x2="780" y2="170"><animate attributeName="stroke-dashoffset" from="66" to="0" dur="2.6s" begin="0.3s" repeatCount="indefinite"/></line>
    <line class="pulse" x1="780" y1="170" x2="880" y2="215"><animate attributeName="stroke-dashoffset" from="66" to="0" dur="2.6s" begin="0.9s" repeatCount="indefinite"/></line>
    <line class="pulse" x1="880" y1="215" x2="950" y2="180"><animate attributeName="stroke-dashoffset" from="66" to="0" dur="2.6s" begin="1.4s" repeatCount="indefinite"/></line>

    <!-- nodes -->
    <g class="n">
      <circle cx="680" cy="60"  r="7"><animate attributeName="r" values="6;9;6" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="680" cy="120" r="7"><animate attributeName="r" values="6;9;6" dur="3s" begin="0.4s" repeatCount="indefinite"/></circle>
      <circle cx="680" cy="180" r="7"><animate attributeName="r" values="6;9;6" dur="3s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="680" cy="240" r="7"><animate attributeName="r" values="6;9;6" dur="3s" begin="1.2s" repeatCount="indefinite"/></circle>
    </g>
    <g class="n2">
      <circle cx="780" cy="40"  r="7"><animate attributeName="r" values="6;9;6" dur="3.4s" begin="0.2s" repeatCount="indefinite"/></circle>
      <circle cx="780" cy="105" r="7"><animate attributeName="r" values="6;9;6" dur="3.4s" begin="0.7s" repeatCount="indefinite"/></circle>
      <circle cx="780" cy="170" r="7"><animate attributeName="r" values="6;9;6" dur="3.4s" begin="1.1s" repeatCount="indefinite"/></circle>
      <circle cx="780" cy="235" r="7"><animate attributeName="r" values="6;9;6" dur="3.4s" begin="1.6s" repeatCount="indefinite"/></circle>
    </g>
    <g class="n3">
      <circle cx="880" cy="75"  r="7"><animate attributeName="r" values="6;9;6" dur="3.8s" begin="0.3s" repeatCount="indefinite"/></circle>
      <circle cx="880" cy="150" r="7"><animate attributeName="r" values="6;9;6" dur="3.8s" begin="0.9s" repeatCount="indefinite"/></circle>
      <circle cx="880" cy="215" r="7"><animate attributeName="r" values="6;9;6" dur="3.8s" begin="1.5s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#f0883e">
      <circle cx="950" cy="110" r="8"><animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="950" cy="180" r="8"><animate attributeName="opacity" values="0.35;1;0.35" dur="2s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- text (left side) -->
  <text class="tag" x="60" y="78">
    &lt;hello world /&gt;
    <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze"/>
  </text>

  <text class="name" x="60" y="140">
    Mustafa Arıkan
    <animate attributeName="opacity" values="0;1" dur="1.4s" begin="0.3s" fill="freeze"/>
    <animate attributeName="y" values="160;140" dur="1.2s" begin="0.3s" fill="freeze"/>
  </text>

  <text class="role" x="60" y="185">
    Computer Engineer  ·  AI / ML  ·  NLP  ·  MLOps
    <animate attributeName="opacity" values="0;1" dur="1.4s" begin="0.9s" fill="freeze"/>
  </text>

  <text class="tag" x="60" y="222">
    Konya, Türkiye  ·  KTO Karatay University '27
    <animate attributeName="opacity" values="0;1" dur="1.4s" begin="1.3s" fill="freeze"/>
  </text>

  <!-- blinking cursor -->
  <rect x="60" y="238" width="12" height="3" fill="#58a6ff">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
